name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  pr-builder:
    needs:
      - build-details
      - check-nightly-ci
      - changed-files
      - checks
      - check-c-abi
      - security-suite
      - conda-cpp-build
      - conda-cpp-tests
      - conda-cpp-checks
      - conda-python-build
      - conda-python-tests
      - rocky8-clib-standalone-build
      - rocky8-clib-tests
      - conda-java-build
      - conda-java-tests
      - conda-lucene-build
      - conda-lucene-tests
      - rust-build
      - go-build
      - docs-build
      - docs-build-matrix
      - wheel-build-libcuvs
      - wheel-build-cuvs
      - wheel-tests-cuvs
      - devcontainer
      - telemetry-setup
    uses: rapidsai/shared-workflows/.github/workflows/pr-builder.yaml@main
    permissions:
      contents: read
    if: always()
    with:
      needs: ${{ toJSON(needs) }}
  telemetry-setup:
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OTEL_SERVICE_NAME: 'pr-cuvs'
    steps:
      - name: Telemetry setup
        if: ${{ vars.TELEMETRY_ENABLED == 'true' }}
        uses: rapidsai/shared-actions/telemetry-dispatch-stash-base-env-vars@main
  build-details:
    uses: rapidsai/shared-workflows/.github/workflows/compute-build-details.yaml@main
  check-nightly-ci:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get PR Info
        id: get-pr-info
        uses: nv-gha-runners/get-pr-info@main
      - name: Check if nightly CI is passing
        uses: rapidsai/shared-actions/check_nightly_success/dispatch@main
        with:
          repo: ${{ github.repository }}
          target-branch: ${{ fromJSON(steps.get-pr-info.outputs.pr-info).base.ref }}
          max-days-without-success: 30
  changed-files:
    needs: telemetry-setup
    permissions:
      actions: read
      contents: read
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/changed-files.yaml@main
    with:
      files_yaml: |
        build_docs:
          - '**'
          - '!**/*/REVIEW_GUIDELINES.md'
          - '!.coderabbit.yaml'
          - '!.devcontainer/**'
          - '!.github/CODEOWNERS'
          - '!.github/ISSUE_TEMPLATE/**'
          - '!.github/PULL_REQUEST_TEMPLATE.md'
          - '!.github/copy-pr-bot.yaml'
          - '!.github/labeler.yml'
          - '!.github/ops-bot.yaml'
          - '!.github/release.yml'
          - '!.github/workflows/build.yaml'
          - '!.github/workflows/check-c-abi.yaml'
          - '!.github/workflows/labeler.yml'
          - '!.github/workflows/publish-rust.yaml'
          - '!.github/workflows/security-suite.yml'
          - '!.github/workflows/store-c-abi-baseline.yaml'
          - '!.github/workflows/test.yaml'
          - '!.github/workflows/trigger-breaking-change-alert.yaml'
          - '!.github/workflows/update-c-abi-baseline.yaml'
          - '!.pre-commit-config.yaml'
          - '!.shellcheckrc'
          - '!.yamllint.yaml'
          - '!Dockerfile'
          - '!SECURITY.md'
          - '!ci/build_wheel*.sh'
          - '!ci/check_style.sh'
          - '!ci/release/update-version.sh'
          - '!ci/run*.sh'
          - '!ci/test*.sh'
          - '!ci/validate_wheel.sh'
          - '!thirdparty/LICENSES/**'
        test_cpp:
          - '.github/workflows/pr.yaml'
          - 'RAPIDS_BRANCH'
          - 'VERSION'
          - 'build.sh'
          - 'c/**'
          - 'ci/build_cpp.sh'
          - 'ci/get_test_data.sh'
          - 'ci/test_cpp.sh'
          - 'cmake/**'
          - 'conda/recipes/libcuvs/**'
          - 'cpp/**'
          - 'dependencies.yaml'
          - '!**/*/REVIEW_GUIDELINES.md'
          - '!cpp/doxygen/**'
        test_standalone_c:
          - '.github/workflows/pr.yaml'
