name: pr

on:
  push:
    branches:
      - "pull-request/[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  pr-builder:
    needs:
      - java-build
      - lucene-build
    uses: rapidsai/shared-workflows/.github/workflows/pr-builder.yaml@main
    permissions:
      contents: read
    if: always()
    with:
      needs: ${{ toJSON(needs) }}

  # This draft deliberately resolves the published libcuvs package so the
  # shared Maven workflow can be tested on CPU runners without rebuilding C++
  # or Python. GPU tests remain separate because the current test scripts also
  # rebuild the JARs; see https://github.com/rapidsai/cuvs/issues/868.
  java-build:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/maven-build.yaml@1fc50a1789a34a4e7b67ae23af71fc041067a1af
    with:
      build_type: pull-request
      matrix-filter: map(select(.ARCH == "amd64"))
      script: RAPIDS_USE_PUBLISHED_LIBCUVS=true ci/build_java.sh
      file-to-upload: java/cuvs-java/target/
      artifact-name-prefix: cuvs_java
      container-image-repository: rapidsai/ci-conda
      container-image-version: '26.10'

  lucene-build:
    needs: java-build
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/maven-build.yaml@1fc50a1789a34a4e7b67ae23af71fc041067a1af
    with:
      build_type: pull-request
      matrix-filter: map(select(.ARCH == "amd64"))
      script: RAPIDS_USE_PUBLISHED_LIBCUVS=true ci/build_lucene.sh
      file-to-upload: java/cuvs-lucene/target/
      artifact-name-prefix: cuvs_lucene
      container-image-repository: rapidsai/ci-conda
      container-image-version: '26.10'
