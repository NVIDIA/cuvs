name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  pr-builder:
    needs:
      - build-details
      - conda-cpp-build
      - conda-cpp-tests
    uses: rapidsai/shared-workflows/.github/workflows/pr-builder.yaml@main
    permissions:
      contents: read
    if: always()
    with:
      needs: ${{ toJSON(needs) }}
  build-details:
    uses: rapidsai/shared-workflows/.github/workflows/compute-build-details.yaml@main
  conda-cpp-build:
    needs: [build-details]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu16
      script: ci/build_cpp.sh
      matrix_filter: map(select(.ARCH == "arm64" and (.CUDA_VER | startswith("12."))))
  conda-cpp-tests:
    needs: [conda-cpp-build]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-tests.yaml@main
    if: true
    with:
      build_type: pull-request
      script: "ci/test_cpp.sh"
      matrix_filter: 'map(select(.ARCH == "arm64" and .GPU == "a100")) | [range(4) as $i | .[] | . + {COPY: $i}]'
      cache-paths: .cache/cuda-jit
      cache-key-prefix: libcuvs-cudajit-v1
      # Caches are immutable. Re-key when the JIT-relevant sources change so a completed run can
      # save newly compiled entries; restore a compatible earlier archive first.
      cache-key-files: |
        cpp/CMakeLists.txt
        cpp/cmake/**
        cpp/include/cuvs/detail/jit_lto/**
        cpp/src/detail/jit_lto/**
        cpp/src/distance/detail/pairwise_matrix/jit_lto_kernels/**
        cpp/src/neighbors/detail/cagra/jit_lto_kernels/**
        cpp/src/neighbors/detail/jit_lto_kernels/**
        cpp/src/neighbors/ivf_flat/detail/jit_lto_kernels/**
        cpp/src/neighbors/ivf_pq/detail/jit_lto_kernels/**
        cpp/src/neighbors/ivf_rabitq/jit_lto_kernels/**
        cpp/src/neighbors/ivf_sq/detail/jit_lto_kernels/**
        cpp/tests/**
        dependencies.yaml
      # The CUDA driver's JIT cache is independent of the Python interpreter used to run C++ tests.
      cache-key-matrix-fields: |
        CUDA_VER
        ARCH
        LINUX_VER
        GPU
        DRIVER
        DEPENDENCIES
      # PRs restore a compatible main cache but do not create merge-ref-scoped entries.
      cache-read-only: true
      cache-environment: |
        CUDA_CACHE_PATH=.cache/cuda-jit
