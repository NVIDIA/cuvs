name: pr
on:
  push:
    branches:
      - "pull-request/[0-9]+"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  pr-builder:
    needs:
      - build-details
      - conda-cpp-build
      - conda-cpp-tests
      - conda-java-build
      - conda-lucene-build
      - conda-lucene-tests
      - telemetry-setup
    uses: rapidsai/shared-workflows/.github/workflows/pr-builder.yaml@main
    permissions:
      contents: read
    if: always()
    with:
      needs: ${{ toJSON(needs) }}
  telemetry-setup:
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OTEL_SERVICE_NAME: 'pr-cuvs'
    steps:
      - name: Telemetry setup
        if: ${{ vars.TELEMETRY_ENABLED == 'true' }}
        uses: rapidsai/shared-actions/telemetry-dispatch-stash-base-env-vars@main
  build-details:
    uses: rapidsai/shared-workflows/.github/workflows/compute-build-details.yaml@main
  conda-cpp-build:
    needs: [build-details]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu16
      script: ci/build_cpp.sh
      matrix_filter: map(select(.CUDA_VER | startswith("13")))
  conda-cpp-tests:
    needs: [conda-cpp-build]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-tests.yaml@main
    with:
      build_type: pull-request
      matrix_filter: map(select(.ARCH == "amd64" and (.CUDA_VER | startswith("13")))) | .[0:1]
      script: "ci/test_cpp.sh"
  conda-java-build:
    needs: [conda-cpp-build]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/matrix-job.yaml
    # Artifacts are not published from these jobs, so it's safe to run for multiple CUDA versions.
    # If these jobs start producing artifacts, the names will have to differentiate between CUDA versions.
    with:
      build_type: pull-request
      node_type: cpu8
      matrix_filter: map(select(.ARCH == "amd64" and (.CUDA_VER | startswith("13"))))
      script: "ci/build_java.sh"
      artifact-name-prefix: "cuvs-java"
      file_to_upload: "java/cuvs-java/target/"
  conda-lucene-build:
    # Depends on the Java job for the cuvs-java artifact that cuvs-lucene builds against.
    needs: conda-java-build
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/matrix-job.yaml
    # Artifacts are not published from these jobs, so it's safe to run for multiple CUDA versions.
    # If these jobs start producing artifacts, the names will have to differentiate between CUDA versions.
    with:
      build_type: pull-request
      node_type: cpu8
      matrix_filter: map(select(.ARCH == "amd64" and (.CUDA_VER | startswith("13"))))
      script: "ci/build_lucene.sh"
      artifact-name-prefix: "cuvs-lucene"
      file_to_upload: "java/cuvs-lucene/target/"
  conda-lucene-tests:
    needs: conda-lucene-build
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/matrix-job.yaml
    with:
      build_type: pull-request
      matrix_filter: 'map(select(.CUDA_VER | startswith("13"))) | [range(2) as $i | .[] | . + {COPY: $i}]'
      script: "ci/test_lucene.sh"
