  checks:
    needs: telemetry-setup
    uses: rapidsai/shared-workflows/.github/workflows/checks.yaml@main
    permissions:
      contents: read
    with:
      enable_check_generated_files: false
      ignored_pr_jobs: "telemetry-summarize"
  check-c-abi:
    needs: telemetry-setup
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/check-c-abi.yaml
  security-suite:
    permissions:
      actions: read
      contents: read
      id-token: write # OIDC -> Vault -> nvcr.io image pull
      security-events: write # publish redacted SARIF to code scanning
    uses: ./.github/workflows/security-suite.yml
  conda-cpp-build:
    needs: [build-details, checks]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu16
      script: ci/build_cpp.sh
  conda-cpp-tests:
    needs: [conda-cpp-build, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-tests.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_cpp
    # Split the C++ tests across several jobs for each CUDA/GPU configuration
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        num_shards: [4]
    with:
      build_type: pull-request
      script: "ci/test_cpp.sh ${{ matrix.shard }} ${{ matrix.num_shards }}"
      cache-paths: .cache/cuda-jit
      # One cache per test shard: each shard links a different set of kernels, and with a shared key
      # only the first shard to finish could save its archive.
      cache-key-prefix: libcuvs-cudajit-v1-shard${{ matrix.shard }}of${{ matrix.num_shards }}
      # Caches are immutable. Re-key when the JIT-relevant sources change so a completed run can
      # save newly compiled entries; restore a compatible earlier archive first.
      cache-key-files: |
        cpp/CMakeLists.txt
        cpp/cmake/**
        cpp/include/cuvs/detail/jit_lto/**
        cpp/src/detail/jit_lto/**
        cpp/src/distance/detail/pairwise_matrix/jit_lto_kernels/**
        cpp/src/neighbors/detail/cagra/jit_lto_kernels/**
        cpp/src/neighbors/detail/jit_lto_kernels/**
        cpp/src/neighbors/ivf_flat/detail/jit_lto_kernels/**
        cpp/src/neighbors/ivf_pq/detail/jit_lto_kernels/**
        cpp/src/neighbors/ivf_rabitq/jit_lto_kernels/**
        cpp/src/neighbors/ivf_sq/detail/jit_lto_kernels/**
        cpp/tests/**
        dependencies.yaml
      # The CUDA driver's JIT cache is independent of the Python interpreter used to run C++ tests.
      cache-key-matrix-fields: |
        CUDA_VER
        ARCH
        LINUX_VER
        GPU
        DRIVER
        DEPENDENCIES
      # PRs restore a compatible main cache but do not create merge-ref-scoped entries.
      cache-read-only: true
      cache-environment: |
        CUDA_CACHE_PATH=.cache/cuda-jit
  conda-cpp-checks:
    needs: conda-cpp-build
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-post-build-checks.yaml@main
    with:
      build_type: pull-request
      symbol_exclusions: (void (thrust::|cub::))
      package_name: libcuvs
  conda-python-build:
    needs: [build-details, conda-cpp-build]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      script: ci/build_python.sh
      # Build a conda package for each CUDA x ARCH x minimum supported Python version
      matrix_filter: group_by({CUDA_VER, ARCH}) | map(min_by(.PY_VER | split(".") | map(tonumber)))
  conda-python-tests:
    needs: [conda-python-build, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-tests.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_python_conda
    with:
      build_type: pull-request
      script: ci/test_python.sh
  rocky8-clib-standalone-build:
    needs: checks
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/clib-build.yaml
    with:
      build_type: pull-request
  rocky8-clib-tests:
    needs: [rocky8-clib-standalone-build, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/matrix-job.yaml
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_standalone_c
    with:
      build_type: pull-request
      container-image-repository: "rapidsai/citestwheel"
      script: "ci/test_standalone_c.sh"
  conda-java-build:
    needs: [conda-cpp-build, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/matrix-job.yaml
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_java || fromJSON(needs.changed-files.outputs.changed_file_groups).test_cpp
    # Artifacts are not published from these jobs, so it's safe to run for multiple CUDA versions.
    # If these jobs start producing artifacts, the names will have to differentiate between CUDA versions.
    with:
      build_type: pull-request
      node_type: cpu8
      matrix_filter: map(select(.ARCH == "amd64"))
      script: "ci/build_java.sh"
      artifact-name-prefix: "cuvs-java"
      file_to_upload: "java/cuvs-java/target/"
  conda-java-tests:
    needs: conda-java-build
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/matrix-job.yaml
    with:
      build_type: pull-request
      script: "ci/test_java.sh"
  conda-lucene-build:
    # Depends on the Java job for the cuvs-java artifact that cuvs-lucene builds against.
    needs: conda-java-build
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/matrix-job.yaml
    # Artifacts are not published from these jobs, so it's safe to run for multiple CUDA versions.
    # If these jobs start producing artifacts, the names will have to differentiate between CUDA versions.
    with:
      build_type: pull-request
      node_type: cpu8
      matrix_filter: map(select(.ARCH == "amd64"))
      script: "ci/build_lucene.sh"
      artifact-name-prefix: "cuvs-lucene"
      file_to_upload: "java/cuvs-lucene/target/"
  conda-lucene-tests:
    needs: conda-lucene-build
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/matrix-job.yaml
    with:
      build_type: pull-request
      script: "ci/test_lucene.sh"
  rust-build:
    needs: [conda-cpp-build, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/matrix-job.yaml
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_rust || fromJSON(needs.changed-files.outputs.changed_file_groups).test_cpp
    # Artifacts are not published from these jobs, so it's safe to run for multiple CUDA versions.
    # If these jobs start producing artifacts, the names will have to differentiate between CUDA versions.
    with:
      build_type: pull-request
      matrix_filter: map(select(.ARCH == "amd64"))
      script: "ci/build_rust.sh"
  go-build:
    needs: [conda-cpp-build, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/matrix-job.yaml
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_go || fromJSON(needs.changed-files.outputs.changed_file_groups).test_cpp
    # Artifacts are not published from these jobs, so it's safe to run for multiple CUDA versions.
    # If these jobs start producing artifacts, the names will have to differentiate between CUDA versions.
    with:
      build_type: pull-request
      matrix_filter: map(select(.ARCH == "amd64"))
      script: "ci/build_go.sh"
  docs-build-matrix:
    permissions:
      contents: read
    uses: rapidsai/shared-workflows/.github/workflows/compute-matrix.yaml@main
    with:
      build_type: pull-request
      matrix_name: docs-build
  docs-build:
    needs: [docs-build-matrix]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).build_docs
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.docs-build-matrix.outputs.matrix) }}
    with:
      build_type: pull-request
      node_type: "gpu-${{ matrix.GPU }}-${{ matrix.DRIVER }}-1"
      arch: "${{ matrix.arch }}"
      container_image: "rapidsai/ci-conda:26.12-cuda${{ matrix.CUDA_VER }}-${{ matrix.LINUX_VER }}-py${{ matrix.PY_VER }}"
      script: "ci/build_docs.sh"
  wheel-build-libcuvs:
    needs: [build-details, checks]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu16
      script: ci/build_wheel_libcuvs.sh
      # build for every combination of arch and CUDA version, but only for the latest Python
      matrix_filter: group_by([.ARCH, (.CUDA_VER|split(".")|map(tonumber)|.[0])]) | map(max_by(.PY_VER|split(".")|map(tonumber)))
      package-name: libcuvs
      package-type: cpp
  wheel-build-cuvs:
    needs: [build-details, wheel-build-libcuvs]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@main
    with:
      build_type: pull-request
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      node_type: cpu8
      script: ci/build_wheel_cuvs.sh
      package-name: cuvs
      package-type: python
      # Build a wheel for each CUDA x ARCH x minimum supported Python version
      matrix_filter: group_by({CUDA_VER, ARCH}) | map(min_by(.PY_VER | split(".") | map(tonumber)))
  wheel-tests-cuvs:
    needs: [wheel-build-cuvs, changed-files]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-test.yaml@main
    if: fromJSON(needs.changed-files.outputs.changed_file_groups).test_python_wheels
    with:
      build_type: pull-request
      script: ci/test_wheel_cuvs.sh
  devcontainer:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    needs: telemetry-setup
    uses: rapidsai/shared-workflows/.github/workflows/build-in-devcontainer.yaml@main
    with:
      arch: '["amd64", "arm64"]'
      cuda: '["13.3"]'
      node_type: "cpu8"
      env: |
        SCCACHE_DIST_MAX_RETRIES=inf
        SCCACHE_SERVER_LOG=sccache=debug
        SCCACHE_DIST_FALLBACK_TO_LOCAL_COMPILE=false
      build_command: |
        sccache --zero-stats;
        build-all -j0 --verbose 2>&1 | tee telemetry-artifacts/build.log;
        sccache --show-adv-stats | tee telemetry-artifacts/sccache-stats.txt;
  telemetry-summarize:
    # This job must use a self-hosted runner to record telemetry traces.
    runs-on: linux-amd64-cpu4
    needs: pr-builder
    permissions:
      actions: write
    if: ${{ vars.TELEMETRY_ENABLED == 'true' && !cancelled() }}
    continue-on-error: true
    steps:
      - name: Telemetry summarize
        uses: rapidsai/shared-actions/telemetry-dispatch-summarize@main
    env:
      GH_TOKEN: ${{ github.token }}
