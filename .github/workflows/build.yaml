name: build

on:
  push:
    branches:
      - "main"
      - "release/*"
    tags:
      - v[0-9][0-9].[0-9][0-9].[0-9][0-9]
  workflow_dispatch:
    inputs:
      branch:
        description: |
          branch: git branch the workflow run targets.
          Required even when 'sha' is provided because it is also used for organizing artifacts.
        required: true
        type: string
      date:
        description: "date: Date (YYYY-MM-DD) this run is for. Used to organize artifacts produced by nightly builds"
        required: true
        type: string
      sha:
        description: "sha: full git commit SHA to check out"
        required: true
        type: string
      build_type:
        description: "build_type: one of [branch, nightly, pull-request]"
        type: string
        default: nightly

# Maven release concurrency
#
# We have to be careful when deploying Maven artifacts. `cancel-in-progress` is a
# common configuration that limits CI to one build at a time. New commits being
# pushed will cancel an in-progress run. We do want `cancel-in-progress`
# behavior for most runs/steps, but not for the maven deploy step. The
# interruption of `cancel-in-progress` during publishing could lead to a
# corrupt or incorrect release that we cannot undo.
#
# Branch and nightly runs keep workflow-level cancellation. Each tag run
# gets its own workflow group so a competing run can't cancel the whole
# run. If we allowed workflow-level cancellation for tags, it could stop
# an active publisher even with cancellation disabled in the job's group.
#
# Job-level concurrency applies only to jobs in the same group. Selected
# build and gather jobs can cancel matching jobs for the same tag. The shared
# publisher groups jobs by repository and artifact and disables cancellation
# by competing publisher jobs. The publisher's polling timeout still applies.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ inputs.build_type || 'branch' }}${{ github.ref_type == 'tag' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions: {}

jobs:
  checks:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: read
    uses: rapidsai/shared-workflows/.github/workflows/checks.yaml@release/26.12
    with:
      # Seed the default-branch pre-commit cache without running checks that only apply to PRs.
      base-branch: main
      enable_check_size: false
      enable_check_generated_files: false
      enable_check_pr_job_dependencies: false
      enable_check_version_files_changed: false
      enable_check_version_against_tag: false
  build-details:
    uses: rapidsai/shared-workflows/.github/workflows/compute-build-details.yaml@release/26.12
  cpp-build:
    # See Maven release concurrency above. Java depends on this native build.
    concurrency:
      group: ${{ github.workflow }}-prep-cpp-build-${{ github.ref }}-${{ github.event_name }}-${{ inputs.build_type || 'branch' }}
      cancel-in-progress: ${{ github.ref_type == 'tag' }}
    needs: [build-details]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-cpp-build.yaml@release/26.12
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      node_type: cpu16
      script: ci/build_cpp.sh
      sha: ${{ inputs.sha }}
      matrix_type: nightly

  rocky8-clib-standalone-build:
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/clib-build.yaml
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      matrix_type: nightly
  rust-build:
    needs: cpp-build
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/matrix-job.yaml
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      matrix_filter: map(select(.ARCH == "amd64"))
      script: "ci/build_rust.sh"
      matrix_type: nightly
  go-build:
    needs: cpp-build
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/matrix-job.yaml
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      matrix_filter: map(select(.ARCH == "amd64"))
      script: "ci/build_go.sh"
      matrix_type: nightly
  java-build:
    # See Maven release concurrency above.
    concurrency:
      group: ${{ github.workflow }}-prep-java-build-${{ github.ref }}-${{ github.event_name }}-${{ inputs.build_type || 'branch' }}
      cancel-in-progress: ${{ github.ref_type == 'tag' }}
    needs: cpp-build
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/matrix-job.yaml
    # Keep CUDA builds separate; the release gather job retains their native classifiers.
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      node_type: cpu8
      matrix_filter: map(select(.ARCH == "amd64"))
      script: "ci/build_java.sh"
      artifact-name-prefix: "cuvs-java"
      file_to_upload: "java/cuvs-java/target/"
      matrix_type: nightly
  lucene-build:
    # See Maven release concurrency above.
    concurrency:
      group: ${{ github.workflow }}-prep-lucene-build-${{ github.ref }}-${{ github.event_name }}-${{ inputs.build_type || 'branch' }}
      cancel-in-progress: ${{ github.ref_type == 'tag' }}
    # Depends on the Java job for the cuvs-java artifact that cuvs-lucene builds against.
    needs: java-build
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: ./.github/workflows/matrix-job.yaml
    # Build against the matching cuvs-java artifact from this workflow run.
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      node_type: cpu8
      matrix_filter: map(select(.ARCH == "amd64"))
      script: "ci/build_lucene.sh"
      artifact-name-prefix: "cuvs-lucene"
      file_to_upload: |
        java/cuvs-lucene/target/
        java/cuvs-lucene/*/target/
      matrix_type: nightly
  java-maven-gather:
    # See Maven release concurrency above. Each module has its own group.
    concurrency:
      group: ${{ github.workflow }}-prep-java-maven-gather-${{ github.ref }}-${{ github.event_name }}-${{ inputs.build_type || 'branch' }}-${{ matrix.module }}
      cancel-in-progress: ${{ github.ref_type == 'tag' }}
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    needs: [java-build, lucene-build]
    runs-on: linux-amd64-cpu4
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        module: [cuvs-java, cuvs-lucene]
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - name: Download module builds from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ matrix.module }}-cuda*
          path: ${{ runner.temp }}/java-builds
      - name: Assemble Maven repository
        env:
          MODULE: ${{ matrix.module }}
        run: |
          python3 java/ci/assemble_maven_repo.py \
            --module "${MODULE}" --tag "${GITHUB_REF_NAME}" \
            --artifacts-dir "${RUNNER_TEMP}/java-builds" \
            --output-dir "${RUNNER_TEMP}/maven-repo"
      - name: Upload assembled Maven repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.module }}_maven_repo
          path: ${{ runner.temp }}/maven-repo
          if-no-files-found: error
  java-publish:
    # See Maven release concurrency above for the publisher's policy.
    needs: java-maven-gather
    permissions:
      actions: read
      contents: read
    uses: rapidsai/shared-workflows/.github/workflows/maven-publish.yaml@release/26.12
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      MAVEN_DEPLOY_TOKEN: ${{ secrets.MAVEN_DEPLOY_TOKEN }}
    with:
      artifact-name: cuvs-java_maven_repo
      source-git-sha: ${{ inputs.sha || github.sha }}
  lucene-publish:
    # See Maven release concurrency above for the publisher's policy.
    # The Lucene release depends on the matching published Java coordinate.
    if: ${{ !cancelled() && needs.java-publish.outputs.deployment-state == 'PUBLISHED' }}
    needs: [java-maven-gather, java-publish]
    permissions:
      actions: read
      contents: read
    uses: rapidsai/shared-workflows/.github/workflows/maven-publish.yaml@release/26.12
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      MAVEN_DEPLOY_TOKEN: ${{ secrets.MAVEN_DEPLOY_TOKEN }}
    with:
      artifact-name: cuvs-lucene_maven_repo
      primary-artifact-id: cuvs-lucene
      source-git-sha: ${{ inputs.sha || github.sha }}
  python-build:
    needs: [build-details, cpp-build]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/conda-python-build.yaml@release/26.12
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      script: ci/build_python.sh
      sha: ${{ inputs.sha }}
      # Build a conda package for each CUDA x ARCH x minimum supported Python version
      matrix_filter: group_by({CUDA_VER, ARCH}) | map(min_by(.PY_VER | split(".") | map(tonumber)))
      matrix_type: nightly
  upload-conda:
    needs: [cpp-build, python-build]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/conda-upload-packages.yaml@release/26.12
    secrets:
      CONDA_RAPIDSAI_NIGHTLY_TOKEN: ${{ secrets.CONDA_RAPIDSAI_NIGHTLY_TOKEN }}
      CONDA_RAPIDSAI_TOKEN: ${{ secrets.CONDA_RAPIDSAI_TOKEN }}
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      date: ${{ inputs.date }}
      sha: ${{ inputs.sha }}
      skip_upload_pkgs: libcuvs-template
  rust-publish:
    needs: [rust-build, upload-conda]
    permissions:
      contents: read
    secrets:
      GPUTESTER_CRATES_TOKEN: ${{ secrets.GPUTESTER_CRATES_TOKEN }}
    uses: ./.github/workflows/publish-rust.yaml
  docs-build-matrix:
    permissions:
      contents: read
    uses: rapidsai/shared-workflows/.github/workflows/compute-matrix.yaml@release/26.12
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      matrix_name: docs-build
      matrix_type: nightly
  docs-build:
    needs: [docs-build-matrix]
    if: github.ref_type == 'branch'
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/custom-job.yaml@release/26.12
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.docs-build-matrix.outputs.matrix) }}
    with:
      arch: "${{ matrix.arch }}"
      branch: ${{ inputs.branch }}
      build_type: ${{ inputs.build_type || 'branch' }}
      container_image: "rapidsai/ci-conda:26.12-cuda${{ matrix.CUDA_VER }}-${{ matrix.LINUX_VER }}-py${{ matrix.PY_VER }}"
      date: ${{ inputs.date }}
      node_type: "gpu-${{ matrix.GPU }}-${{ matrix.DRIVER }}-1"
      script: "ci/build_docs.sh"
      sha: ${{ inputs.sha }}
  wheel-build-libcuvs:
    needs: [build-details]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@release/26.12
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      node_type: cpu16
      script: ci/build_wheel_libcuvs.sh
      # build for every combination of arch and CUDA version, but only for the latest Python
      matrix_filter: group_by([.ARCH, (.CUDA_VER|split(".")|map(tonumber)|.[0])]) | map(max_by(.PY_VER|split(".")|map(tonumber)))
      package-name: libcuvs
      package-type: cpp
      matrix_type: nightly
  wheel-publish-libcuvs:
    needs: wheel-build-libcuvs
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/wheels-publish.yaml@release/26.12
    secrets:
      CONDA_RAPIDSAI_WHEELS_NIGHTLY_TOKEN: ${{ secrets.CONDA_RAPIDSAI_WHEELS_NIGHTLY_TOKEN }}
      RAPIDSAI_PYPI_TOKEN: ${{ secrets.RAPIDSAI_PYPI_TOKEN }}
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      package-name: libcuvs
      package-type: cpp
      publish-wheel-search-key: cuvs_wheel_cpp_libcuvs
  wheel-build-cuvs:
    needs: [build-details, wheel-build-libcuvs]
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    secrets: inherit # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/wheels-build.yaml@release/26.12
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      build-datetime: ${{ needs.build-details.outputs.build-datetime }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      node_type: cpu8
      script: ci/build_wheel_cuvs.sh
      package-name: cuvs
      package-type: python
      # Build a wheel for each CUDA x ARCH x minimum supported Python version
      matrix_filter: group_by({CUDA_VER, ARCH}) | map(min_by(.PY_VER | split(".") | map(tonumber)))
      matrix_type: nightly
  wheel-publish-cuvs:
    needs: wheel-build-cuvs
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pull-requests: read
    uses: rapidsai/shared-workflows/.github/workflows/wheels-publish.yaml@release/26.12
    secrets:
      CONDA_RAPIDSAI_WHEELS_NIGHTLY_TOKEN: ${{ secrets.CONDA_RAPIDSAI_WHEELS_NIGHTLY_TOKEN }}
      RAPIDSAI_PYPI_TOKEN: ${{ secrets.RAPIDSAI_PYPI_TOKEN }}
    with:
      build_type: ${{ inputs.build_type || 'branch' }}
      branch: ${{ inputs.branch }}
      sha: ${{ inputs.sha }}
      date: ${{ inputs.date }}
      package-name: cuvs
      package-type: python
      publish-wheel-search-key: cuvs_wheel_python_cuvs
  devcontainers:
    name: Build devcontainers
    secrets: inherit  # zizmor: ignore[secrets-inherit]
    uses: rapidsai/shared-workflows/.github/workflows/build-devcontainers.yaml@release/26.12
    permissions:
      packages: write
    with:
      push: true
      cuda: '["12.9", "13.4"]'
