# PostgreSQL pg_cuvs GPU CAGRA build plus export, then pgvector CPU search.
name: pgcuvs_hnsw_import
groups:
  base:
    build:
      graph_degree: [32, 64]
      intermediate_graph_degree: [128]
      build_algo: [ivf_pq]
      mode: [nsw]
    search:
      ef_search: [16, 32, 64, 128, 256, 512]
  test:
    build:
      graph_degree: [32]
      intermediate_graph_degree: [128]
      build_algo: [ivf_pq]
      mode: [nsw]
    search:
      ef_search: [16, 64]
