name: cuvs_ivf_pq
constraints:
  build: cuvs_bench.config.algos.constraints.cuvs_ivf_pq_build
  search: cuvs_bench.config.algos.constraints.cuvs_ivf_pq_search
groups:
  base:
    build:
      nlist: [1024, 2048, 4096, 8192]
      pq_dim: [64, 32, 16]
      pq_bits: [8, 6, 5, 4]
      ratio: [10]
      niter: [25]
    search:
      nprobe: [1, 5, 10, 50, 100, 200]
      internalDistanceDtype: ["float"]
      smemLutDtype: ["float", "fp8", "half"]
      refine_ratio: [1, 2, 4]
  nightly:
    build:
      nlist: [1024, 4096]
      pq_dim: [32]
      pq_bits: [8]
      ratio: [10]
      niter: [25]
    search:
      nprobe: [1, 5, 10, 50, 100, 200]
      internalDistanceDtype: ["float"]
      smemLutDtype: ["half"]
      refine_ratio: [1]
  large:
    build:
      nlist: [8192, 16384, 32768, 65536]
      pq_dim: [48, 32, 16]
      pq_bits: [8, 6, 5, 4]
      ratio: [4]
      niter: [20]
    search:
      nprobe: [20, 30, 40, 50, 100, 200, 500, 1000]
      internalDistanceDtype: ["float"]
      smemLutDtype: ["float", "fp8", "half"]
      refine_ratio: [1, 2, 4]
  100M:
    build:
      nlist: [50000]
      pq_dim: [48]
      pq_bits: [8, 6, 5, 4]
      ratio: [10]
      niter: [10]
    search:
      nprobe: [20, 30, 40, 50, 100, 200, 500, 1000]
      internalDistanceDtype: ["float"]
      smemLutDtype: ["float", "fp8", "half"]
      refine_ratio: [1]
  test:
    build:
      nlist: [1024]
      pq_dim: [16]
      pq_bits: [6]
      ratio: [1]
      niter: [20]
    search:
      nprobe: [1, 5]
      internalDistanceDtype: ["float"]
      smemLutDtype: ["half"]
      refine_ratio: [1]
