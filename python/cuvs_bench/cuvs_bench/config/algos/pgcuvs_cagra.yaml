# PostgreSQL pg_cuvs GPU build and resident GPU search.
name: pgcuvs_cagra
groups:
  base:
    build:
      graph_degree: [32, 64]
      intermediate_graph_degree: [128]
      build_algo: [ivf_pq]
    search:
      candidates: [16, 32, 64, 100, 200, 400]
  test:
    build:
      graph_degree: [32]
      intermediate_graph_degree: [128]
      build_algo: [ivf_pq]
    search:
      candidates: [16, 64]
