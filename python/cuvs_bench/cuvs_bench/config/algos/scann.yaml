# ScaNN benchmark configuration - cuVS GPU build, OSS ScaNN CPU search
#
# Build parameters (passed to the cuVS scann_build example)
# ---------------------------------------------------------
# n_leaves          Number of partitioning leaves (k-means clusters).
# pq_dim            Product-quantization subspace dimension (dim must divide it).
# pq_bits           Bits per PQ code (4 or 8).
# partitioning_eta  AVQ eta used during partitioning.
# soar_lambda       SOAR orthogonality amplification lambda.
#
# Search parameters (passed to OSS ScaNN search_batched)
# ------------------------------------------------------
# leaves_to_search  Number of leaves scanned per query.
# reorder           Candidates re-ranked with exact distances (pre-reorder).

name: scann
groups:
  base:
    build:
      n_leaves: [1000, 2000, 5000]
      pq_dim: [64, 32, 16]
      pq_bits: [8, 4]
      partitioning_eta: [1, 2]
      soar_lambda: [1, 1.5]
    search:
      leaves_to_search: [10, 20, 50, 100, 200, 500]
      reorder: [0, 100, 200]
  test:
    build:
      n_leaves: [1000]
      pq_dim: [16]
      pq_bits: [4]
      partitioning_eta: [2]
      soar_lambda: [1.5]
    search:
      leaves_to_search: [50, 100]
      reorder: [100]
