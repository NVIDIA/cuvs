name: cuvs_ivf_rabitq
constraints:
  search: cuvs_bench.config.algos.constraints.cuvs_ivf_rabitq_search
groups:
  base:
    build:
      nlist: [1024, 2048, 4096, 8192]
      bits_per_dim: [1, 2, 4]
      max_points_per_cluster: [256]
      niter: [20]
    search:
      nprobe: [1, 5, 10, 20, 50, 100, 200]
      mode: ["lut16", "lut32", "quant4", "quant8"]
  large:
    build:
      nlist: [8192, 16384, 32768]
      bits_per_dim: [1, 2, 4]
      max_points_per_cluster: [256]
      niter: [20]
    search:
      nprobe: [10, 20, 50, 100, 200, 500, 1000]
      mode: ["lut16", "lut32", "quant4", "quant8"]
  test:
    build:
      nlist: [1024]
      bits_per_dim: [1, 4]
      max_points_per_cluster: [256]
      niter: [20]
    search:
      nprobe: [1, 5]
      mode: ["lut16", "lut32", "quant4", "quant8"]
