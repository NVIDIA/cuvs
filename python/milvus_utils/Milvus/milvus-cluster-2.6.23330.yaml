    # This is a sample to deploy a milvus cluster in milvus-operator's default configurations.
    apiVersion: milvus.io/v1beta1
    kind: Milvus
    metadata:
      name: milvus3
      namespace: kioxia
      labels:
        app: milvus
    spec:
      mode: cluster
      dependencies:
        etcd:
          inCluster:
            values:
              extraEnvVars:
                - name: ETCD_MAX_REQUEST_BYTES
                  value: "536870912"
              args:
                - /opt/bitnami/scripts/etcd/run.sh
                - --quota-backend-bytes
                - "53687091200"

              replicaCount: 3
              persistence:    
                storageClass: local-path
                size: 10Gi
                volumePermissions:
                  enabled: true
        storage:      
          inCluster:
            values:
              environment:
                MINIO_API_STALE_UPLOADS_EXPIRY: 720h
              # change to standalone if you dont have 3 nodes
              mode: distributed
              service:
                type: LoadBalancer
              consoleService:
                type: LoadBalancer
                  
              replicas: 3
              persistence:    
                storageClass: local-path
                size: 10Ti       
                
        pulsar:      
          inCluster:
            values:                       
              zookeeper:
                replicaCount: 3
                volumes:
                  data:
                    size: 40Gi
              broker:
                replicaCount: 3
                resources:
                  limits:
                    cpu: 4
                    memory: 4Gi   
                configData:                                                                                                                                 
                  PULSAR_MEM: >                                                                                                                             
                    -Xms128m -Xmx1024m -XX:MaxDirectMemorySize=1024m                                                    
                  #managedLedgerDefaultAckQuorum: '1'
                  #managedLedgerDefaultEnsembleSize: '1'
                  #managedLedgerDefaultWriteQuorum: '1'                                                
              bookkeeper:
                replicaCount: 3
                configData:                                                                                                                                   
                  # we use `bin/pulsar` for starting bookie daemons                                                                                           
                  PULSAR_MEM: >                                                                                                                             
                    -Xms128m                                                                                                                                
                    -Xmx1024m                                                                                                                                  
                    -XX:MaxDirectMemorySize=1024m                                                                                                            
                resources:
                  limits:
                    cpu: 4
                    memory: 32Gi             
                 
      components:
        proxy:
          replicas: 3
          serviceType: LoadBalancer
          image: 10.93.66.61:32610/milvus:v2.6.23330-kioxia
        queryNode:
          replicas: 4
          image: 10.93.66.61:32610/milvus:v2.6.23330-kioxia
#          env:
#            - name: MALLOC_CONF
#              value: "background_thread:true,prof:true,prof_leak:true,lg_prof_interval:30,lg_prof_sample:19,prof_final:true,stats_print:true,prof_prefix:/var/lib/milvus/data/jeprof"          
          volumeMounts:
          - mountPath: /var/lib/milvus/data
            name: disk
          volumes:
          - name: disk
            hostPath:
              path: "/var/lib/milvus/data"
              type: DirectoryOrCreate
        indexNode:
          replicas: 0
          image: 10.93.66.61:32610/milvus:v2.6.23330-kioxia
          volumeMounts:
          - mountPath: /var/lib/milvus/data
            name: disk
          volumes:
          - name: disk
            hostPath:
              path: "/var/lib/milvus/data"
              type: DirectoryOrCreate
        streamingNode:
          replicas: 3
          image: 10.93.66.61:32610/milvus:v2.6.23330-kioxia
          volumeMounts:
          - mountPath: /var/lib/milvus/data
            name: disk
          volumes:
          - name: disk
            hostPath:
              path: "/var/lib/milvus/data"
              type: DirectoryOrCreate
        mixCoord:
          image: 10.93.66.61:32610/milvus:v2.6.23330-kioxia
          replicas: 1
          volumeMounts:
          - mountPath: /var/lib/milvus/data
            name: disk
          volumes:
          - name: disk
            hostPath:
              path: "/var/lib/milvus/data"
              type: DirectoryOrCreate
        dataNode:
          image: 10.93.66.61:32610/milvus:v2.6.23330-kioxia
          env:
            - name: LOCAL_STORAGE_SIZE
              value: "300"
          replicas: 8
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
          - mountPath: /var/lib/milvus/data
            name: disk
          volumes:
          - name: disk
            hostPath:
              path: "/var/lib/milvus/data"
              type: DirectoryOrCreate

      config:
        minio:
          requestTimeoutMs: 300000
        gpu:
          initMemSize: 0
          maxMemSize: 0      
        log:
          file:
            maxAge: 10
            maxBackups: 20
            maxSize: 100            
          format: text
          level: debug
        common:
          #controls minio fetch parallelism - default is 16-which means 8 threads, 1 is for 128 threads
          indexSliceSize: 1
          DiskIndex:
            BeamWidthRatio: 8
            BuildNumThreadsRatio: 1
            LoadNumThreadRatio: 8
            MaxDegree: 20
            PQCodeBudgetGBRatio: 0.04
            SearchCacheBudgetGBRatio: 0.0
            SearchListSize: 100
          AiSAQIndex:
            BeamWidthRatio: 1
            BuildNumThreadsRatio: 1
            LoadNumThreadRatio: 8
            MaxDegree: 60
            PQCodeBudgetGBRatio: 0.417
            DiskPQCodeBudgetGBRatio: 0.25
            SearchCacheBudgetGBRatio: 0.0
            SearchListSize: 100
            NumEntryPoints: 1000  #<int value, default 0>, Number of entry points that should be generated to be used as a search start points. Value must be between 1 and 1000
            InlinePQ: 0   #<int value, default 0>, Set the number of pq vectors to be stored inline as part of the index node
            PQCacheSize: 0 #<int value, default 0>, Compressed vectors cache DRAM size in bytes
            Rearrange: true  #<boolean value, default false>, Enable vectors rearrangement during build, when enabled, each vector will be assigned and stored with a new id, in a way that the number of IOs needed to read the PQ vectors during search will be minimal. This option is ignored if all PQ vectors are stored inline
            pqReadPageCacheSize: 0 #4800000  #<int value, default
          useVectorAsClusteringKey: true
          enableVectorClusteringKey: true
        proxy:
          grpc:
            serverMaxRecvSize: 2147483648   # 2GB
            serverMaxSendSize: 2147483648
            clientMaxRecvSize: 2147483648
            clientMaxSendSize: 2147483648
        dataNode:
          grpc:
            serverMaxRecvSize: 2147483648   # 2GB
            serverMaxSendSize: 2147483648
            clientMaxRecvSize: 2147483648
            clientMaxSendSize: 2147483648
          import:
            maxConcurrentTaskNum: 64
            maxImportFileSizeInGB: 1024
            concurrencyPerCPUCore: 1
          clusteringCompaction:
            memoryBufferRatio: 0.1
            workPoolSize: 32
          segment:
            binlog:
              maxsize: 1048676

        streamingNode:
          grpc:
            serverMaxRecvSize: 2147483648   # 2GB
            serverMaxSendSize: 2147483648
            clientMaxRecvSize: 2147483648
            clientMaxSendSize: 2147483648

        rootCoord:
          grpc:
            serverMaxRecvSize: 2147483648   # 2GB
            serverMaxSendSize: 2147483648
            clientMaxRecvSize: 2147483648
            clientMaxSendSize: 2147483648

        queryNode:
          grpc:
            serverMaxRecvSize: 2147483648   # 2GB
            serverMaxSendSize: 2147483648
            clientMaxRecvSize: 2147483648
            clientMaxSendSize: 2147483648
          segcore:
            knowhereThreadPoolNumRatio: 1
          scheduler:
            maxReadConcurrentRatio: 2
          enableSegmentPrune: true
          defaultSegmentFilterRatio: 1.5
        queryCoord:
          grpc:
            serverMaxRecvSize: 2147483648   # 2GB
            serverMaxSendSize: 2147483648
            clientMaxRecvSize: 2147483648
            clientMaxSendSize: 2147483648
          loadTimeoutSeconds: 6000

        dataCoord:
          grpc:
            serverMaxRecvSize: 2147483648   # 2GB
            serverMaxSendSize: 2147483648
            clientMaxRecvSize: 2147483648
            clientMaxSendSize: 2147483648
          import:
            maxImportFileNumPerReq: 100000
            maxSizeInMBPerImportTask: 117487
#uncomment if using clustering compaction or just import
#          sortCompaction:
#            enable: false
          segment:
            maxSize: 208867
            diskSegmentMaxSize: 208867
            sealProportion: 0.8
            smallProportion: 0.5
          compaction:
            rpcTimeout: 180
            timeout: 5600
            indexBasedCompaction: false
            levelzero:
              forceTrigger:
                maxSize: 85899345920
            clustering:
              enable: false
              maxTrainSizeRatio: 0.2
              autoEnable: true
              triggerInterval: 60
              minInterval: 3600
              maxInterval: 2592000
              newDataSizeThreshold: 1024m
              preferSegmentSizeRatio: 1.5
              maxSegmentSizeRatio: 2.5
              timeout: 720000
              minCentroidsNum: 5
              maxClusterSize: 1024g
              maxTrainBufferSize: 5g
              maxAssignBufferSize: 5g

              maxCentroidsPerSegment: 2
            
            
